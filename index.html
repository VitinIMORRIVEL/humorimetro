<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humorímetro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="placa">
    <!-- Os "botões" de escolha ficam escondidos; cada quadrante é um <label> ligado a um deles -->
    <input type="radio" name="humor" id="bem"     class="escolha">
    <input type="radio" name="humor" id="ok"      class="escolha">
    <input type="radio" name="humor" id="triste"  class="escolha">
    <input type="radio" name="humor" id="cansado" class="escolha">

    <header class="titulo">
      <h1>HUMORÍMETRO</h1>
    </header>

    <section class="quadro">

      <!-- BEM -->
      <label for="bem" class="quadrante amarelo q-bem">
        <span class="moldura">
          <svg class="carinha" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="46" class="rosto"/>
            <path d="M28 42 q7 -9 14 0" class="traco"/>
            <path d="M58 42 q7 -9 14 0" class="traco"/>
            <circle cx="27" cy="58" r="6" class="bochecha"/>
            <circle cx="73" cy="58" r="6" class="bochecha"/>
            <path d="M38 60 q12 14 24 0" class="traco"/>
          </svg>
        </span>
        <span class="palavra">BEM</span>
      </label>

      <!-- OK -->
      <label for="ok" class="quadrante rosa q-ok">
        <svg class="carinha" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" class="rosto"/>
          <ellipse cx="37" cy="38" rx="3.5" ry="4.5" class="olho"/>
          <ellipse cx="63" cy="38" rx="3.5" ry="4.5" class="olho"/>
          <path d="M30 66 h40" class="traco"/>
        </svg>
        <span class="palavra">OK</span>
      </label>

      <!-- TRISTE -->
      <label for="triste" class="quadrante rosa q-triste">
        <svg class="carinha" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" class="rosto"/>
          <path d="M26 36 q7 -6 14 -3" class="traco fino"/>
          <path d="M74 36 q-7 -6 -14 -3" class="traco fino"/>
          <circle cx="36" cy="46" r="4" class="olho"/>
          <circle cx="64" cy="46" r="4" class="olho"/>
          <path d="M33 54 q-5 8 0 10 q5 -2 0 -10 z" class="lagrima"/>
          <path d="M38 72 q12 -12 24 0" class="traco"/>
        </svg>
        <span class="palavra">TRISTE</span>
      </label>

      <!-- CANSADO -->
      <label for="cansado" class="quadrante amarelo q-cansado">
        <span class="moldura">
          <svg class="carinha" viewBox="0 0 100 100" aria-hidden="true">
            <clipPath id="recorte"><circle cx="50" cy="50" r="46"/></clipPath>
            <circle cx="50" cy="50" r="46" class="rosto"/>
            <path d="M0 0 H100 V40 q-12 6 -24 0 q-12 -6 -26 2 q-14 -8 -26 -2 q-12 6 -24 0 Z"
                  class="testa" clip-path="url(#recorte)"/>
            <path d="M26 44 q8 -8 16 -2" class="traco fino"/>
            <path d="M74 44 q-8 -8 -16 -2" class="traco fino"/>
            <circle cx="36" cy="54" r="4" class="olho"/>
            <circle cx="64" cy="54" r="4" class="olho"/>
            <path d="M36 78 q14 -18 28 0 q-14 -5 -28 0 z" class="boca"/>
          </svg>
        </span>
        <span class="palavra">CANSADO</span>
      </label>

      <!-- Ponteiro com a "bolinha de massinha" no centro -->
      <div class="ponteiro" aria-hidden="true"><span class="agulha"></span></div>
      <div class="massinha" aria-hidden="true"></div>
    </section>

    <p class="status" aria-live="polite"></p>

    <!-- Envio do humor escolhido -->
    <div class="envio">
      <input type="text" id="nome" class="campo-nome" placeholder="Seu nome (opcional)" maxlength="40" autocomplete="off">
      <button type="button" id="enviar" class="botao botao-enviar" disabled>Enviar</button>
    </div>
    <p id="aviso" class="aviso" role="status" aria-live="polite"></p>

    <!-- Resumo dos registros salvos (JSON no navegador) -->
    <section class="registros" aria-label="Registros da turma">
      <h2>Registros da turma <span id="total" class="total">0</span></h2>
      <ul class="contagem">
        <li class="amarelo">😊 BEM <strong id="c-bem">0</strong></li>
        <li class="rosa">😐 OK <strong id="c-ok">0</strong></li>
        <li class="rosa">😢 TRISTE <strong id="c-triste">0</strong></li>
        <li class="amarelo">😩 CANSADO <strong id="c-cansado">0</strong></li>
      </ul>
      <div class="acoes">
        <button type="button" id="baixar" class="botao botao-sec">⬇ Baixar JSON</button>
        <button type="button" id="limpar" class="botao botao-sec">🗑 Limpar registros</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
